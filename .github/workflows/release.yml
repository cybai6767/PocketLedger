name: Publish Windows release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers
        shell: pwsh
        run: |
          npm run tauri build -- --bundles nsis,msi 2>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content tauri-build.log -Tail 30) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Tauri build failed::$details"
            exit 1
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "我的记账本 ${{ github.ref_name }}"
          body: |
            Windows 桌面版首次发布。

            下载 `.exe`（推荐）或 `.msi` 安装包即可安装。
            此版本尚未进行商业代码签名，Windows 可能显示安全提示。
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
