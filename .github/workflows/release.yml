name: Publish signed release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Audit source for private files and build output
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          blocked_dirs = {'.git', '.nuxt', '.output', '.release', '.gradle', '.cache', 'node_modules', 'target', 'data', 'dist', '__pycache__'}
          blocked_extensions = {'.apk', '.aab', '.exe', '.msi', '.deb', '.rpm', '.appimage', '.dmg', '.p12', '.jks', '.keystore', '.key', '.sqlite', '.db', '.zip'}
          bad = []
          for filename in filter(None, files):
              path = pathlib.PurePosixPath(filename)
              environment = path.name == '.env' or (path.name.startswith('.env.') and path.name != '.env.example')
              if blocked_dirs.intersection(path.parts) or path.suffix.lower() in blocked_extensions or environment or re.match(r'(PocketLedger-backup-|codex-clipboard-)', path.name):
                  bad.append(filename)
          if bad:
              raise SystemExit('Unexpected private/build files in source control:\n' + '\n'.join(bad))
          print('Source audit passed: no private files or build output tracked.')
          PY

      - name: Determine release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag and package version do not match" >&2
            exit 1
          fi
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]] \
            && git show-ref --verify --quiet "refs/tags/$tag"; then
            publish=false
          fi
          printf 'tag=%s\npublish=%s\n' "$tag" "$publish" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run tests and source checks
        run: |
          npm run test:all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Normalize Windows filename
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          Copy-Item -LiteralPath $installer.FullName -Destination "dist/PocketLedger-${env:RELEASE_TAG}-windows-x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  build-android:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: src-tauri/gen/android/**/*.gradle*

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform, build tools and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing release secret: $variable" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/PocketLedger-release.p12"

      - name: Build signed Android ARM64 APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/PocketLedger-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --apk --target aarch64 --ci

      - name: Verify and normalize signed APK
        shell: bash
        run: |
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/PocketLedger-${RELEASE_TAG}-android-arm64.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-arm64
          path: dist/*.apk
          if-no-files-found: error

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:all

      - name: Build Linux DEB installer
        run: npm run tauri -- build --bundles deb

      - name: Verify and normalize DEB
        shell: bash
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "pocketledger"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$deb" Version)" = "${RELEASE_TAG#v}"
          mkdir -p dist
          cp "$deb" "dist/PocketLedger-${RELEASE_TAG}-linux-amd64.deb"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-amd64
          path: dist/*.deb
          if-no-files-found: error

  publish:
    needs: [prepare, build-windows, build-android, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Verify complete release and generate checksums
        shell: bash
        run: |
          test -s dist/*.exe
          test -s dist/*.apk
          test -s dist/*.deb
          cd dist
          sha256sum -- *.exe *.apk *.deb > SHA256SUMS.txt

      - name: Remove previous installers from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          while IFS= read -r name; do
            case "$name" in
              *.exe|*.apk|*.deb|SHA256SUMS.txt)
                gh release delete-asset "$tag" "$name" --yes
                ;;
            esac
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "口袋账本 ${{ needs.prepare.outputs.tag }}"
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.apk
            dist/*.deb
            dist/SHA256SUMS.txt
