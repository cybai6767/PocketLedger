[package]
name = "pocketledger"
version = "1.0.4"
description = "A local-first personal accounting application"
authors = ["Axiaobo"]
license = "MIT"
repository = "https://github.com/cybai6767/PocketLedger"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "accounting_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal = "1.42.1"
time = { version = "0.3", features = ["formatting"] }
